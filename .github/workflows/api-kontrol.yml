name: API kontrol

# TIKTOK_API_KEY secret'ının eklenip eklenmediğini ve hangi servise benzediğini kontrol eder.
# Anahtarın kendisi hiçbir yere yazılmaz; sadece "var/yok", uzunluk ve tahmini servis.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol
        env:
          K: ${{ secrets.TIKTOK_API_KEY }}
        run: |
          mkdir -p /tmp/k && cd /tmp/k
          if [ -z "$K" ]; then echo "TIKTOK_API_KEY: YOK" > sonuc.txt; else
            n=${#K}; tur="bilinmiyor"
            case "$K" in
              apify_api_*) tur="Apify";;
              sk-*) tur="sk- ile başlıyor (OpenAI benzeri)";;
              aw*) tur="TikTok client key olabilir";;
            esac
            if echo "$K" | grep -Eq '^[0-9a-f]{50}$'; then tur="RapidAPI olabilir (50 hex)"; fi
            echo "TIKTOK_API_KEY: VAR, uzunluk $n, tahmini servis: $tur" > sonuc.txt
          fi
          cat sonuc.txt
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git init -q -b api-kontrol && git add -A && git commit -qm kontrol
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" api-kontrol
