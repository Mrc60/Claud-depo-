name: Ses örnekleri

on:
  push:
    branches: [main]
    paths: ["ses_ornek.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests
      - name: Örnekleri üret
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          set -o pipefail
          python3 ses_ornek.py 2>&1 | tee out_kayit.log || true
          mkdir -p out_sesler && cp out_kayit.log out_sesler/kayit.log
      - name: 'sesler' dalına kaydet
        run: |
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          cp -r out_sesler /tmp/sesler && cd "$(mktemp -d)" && git init -q -b sesler
          cp /tmp/sesler/* . && git add -A && git commit -qm "ses örnekleri"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sesler
