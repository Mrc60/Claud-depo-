name: Transkript

# transkript.txt içindeki ses dosyasını (repo yolu) kelime zamanlarıyla yazıya döker,
# sonucu 'transkript' dalına words.json olarak yazar.
on:
  push:
    branches: [main]
    paths: ["transkript.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yaz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kur
        run: |
          # ffmpeg: hazır derleme (2 kaynak), olmazsa apt; hiçbiri olmazsa PyAV yedeği
          if ! command -v ffmpeg >/dev/null; then
            ( timeout 180 curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz \
              && mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 \
              && sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/ ) \
            || ( timeout 180 curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff2.tar.xz \
              && mkdir -p /tmp/ff2 && tar -xJf /tmp/ff2.tar.xz -C /tmp/ff2 --strip-components=1 \
              && sudo cp /tmp/ff2/bin/ffmpeg /tmp/ff2/bin/ffprobe /usr/local/bin/ ) \
            || { timeout 300 sudo apt-get update -qq || true; timeout 400 sudo apt-get install -y -qq ffmpeg || echo 'ffmpeg yok, PyAV ile devam'; }
          fi
          pip install -q faster-whisper
      - name: Yazıya dök
        run: |
          f=$(head -1 transkript.txt | cut -d" " -f1)
          mkdir -p /tmp/t
          python3 - "$f" > /tmp/t/log.txt 2>&1 <<'PY'
          import sys, json
          from faster_whisper import WhisperModel
          m = WhisperModel("medium", device="cpu", compute_type="int8")
          import shutil, subprocess, numpy as np
          if shutil.which("ffmpeg"):
              raw = subprocess.run(["ffmpeg", "-v", "error", "-i", sys.argv[1], "-f", "f32le", "-ac", "1", "-ar", "16000", "-"], capture_output=True, check=True).stdout
              audio = np.frombuffer(raw, np.float32)
          else:
              import av  # ffmpeg kurulamazsa PyAV ile elle çöz
              c = av.open(sys.argv[1]); rs = av.AudioResampler(format="flt", layout="mono", rate=16000); parts = []
              for fr in c.decode(audio=0):
                  for o in rs.resample(fr):
                      parts.append(o.to_ndarray().reshape(-1))
              audio = np.concatenate(parts).astype(np.float32)
          segs, _ = m.transcribe(audio, language="tr", word_timestamps=True, vad_filter=False)
          W = []
          for s in segs:
              for w in s.words:
                  W.append([round(w.start, 2), round(w.end, 2), w.word.strip()])
          json.dump(W, open("/tmp/t/words.json", "w"), ensure_ascii=False)
          print(" ".join(f"{w[2]}[{w[0]}]" for w in W))
          PY
      - name: Dala yaz
        if: always()
        run: |
          cd /tmp/t
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git init -q -b transkript && git add -A && git commit -qm "transkript"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" transkript
