name: Video üret

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: "Bölüm dosyası (episodes klasöründeki)"
        required: true
        default: "001_kolonya.json"

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Videoyu üret
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
        run: python3 run.py "episodes/${{ github.event.inputs.bolum }}"

      - name: Videoyu indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          retention-days: 14
